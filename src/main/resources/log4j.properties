# TECHNICAL DEBT: Using deprecated Log4j 1.x configuration
# This should be migrated to Log4j 2.x or SLF4J with Logback

# Root logger option
log4j.rootLogger=DEBUG, stdout, file

# Redirect log messages to console
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target=System.out
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# Redirect log messages to a log file
log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=logs/ecommerce.log
log4j.appender.file.MaxFileSize=5MB
log4j.appender.file.MaxBackupIndex=10
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# Application specific loggers
log4j.logger.com.example.ecommerce=DEBUG
log4j.logger.org.springframework=INFO
log4j.logger.org.hibernate=INFO
log4j.logger.org.hibernate.SQL=DEBUG
log4j.logger.org.hibernate.type=TRACE

# TECHNICAL DEBT: Overly verbose logging configuration
log4j.logger.org.springframework.web=DEBUG
log4j.logger.org.springframework.security=DEBUG

# TECHNICAL DEBT: Logging sensitive information (should be avoided)
log4j.logger.com.example.ecommerce.service.UserService=DEBUG
log4j.logger.com.example.ecommerce.controller=DEBUG