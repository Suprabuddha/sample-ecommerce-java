<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - TechMart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        .navbar-brand { 
            font-weight: bold; 
            font-size: 1.5rem;
        }
        .orders-container { 
            margin-top: 2rem; 
        }
        .order-card {
            border: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 1.5rem;
            border-radius: 0.5rem;
        }
        .order-header {
            background-color: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            padding: 1rem 1.5rem;
            border-radius: 0.5rem 0.5rem 0 0;
        }
        .order-body {
            padding: 1.5rem;
        }
        .status-pending { color: #ffc107; font-weight: bold; }
        .status-confirmed { color: #17a2b8; font-weight: bold; }
        .status-processing { color: #6f42c1; font-weight: bold; }
        .status-shipped { color: #fd7e14; font-weight: bold; }
        .status-delivered { color: #28a745; font-weight: bold; }
        .status-cancelled { color: #dc3545; font-weight: bold; }
        .total-amount { 
            font-size: 1.25rem;
            font-weight: bold; 
            color: #28a745; 
        }
        .order-item {
            border-bottom: 1px solid #f8f9fa;
            padding: 0.75rem 0;
        }
        .order-item:last-child {
            border-bottom: none;
        }
        .empty-orders {
            text-align: center;
            padding: 4rem 2rem;
        }
        .empty-orders-icon {
            font-size: 4rem;
            color: #6c757d;
            margin-bottom: 1rem;
        }
        .cart-icon {
            position: relative;
        }
        .cart-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background-color: #dc3545;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/legacy-ecommerce/">
                <i class="fas fa-laptop"></i> TechMart
            </a>
            <div class="navbar-nav ml-auto">
                <a class="nav-link" href="/legacy-ecommerce/">Home</a>
                <a class="nav-link" href="/legacy-ecommerce/products">Products</a>
                <a class="nav-link active" href="/legacy-ecommerce/orders">My Orders</a>
                <a class="nav-link cart-icon" href="/legacy-ecommerce/cart">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-badge" id="cartCount">0</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="container orders-container">
        <div class="row">
            <div class="col-12">
                <h2><i class="fas fa-box"></i> My Orders</h2>
                <p class="text-muted">Track your order history and current shipments</p>
            </div>
        </div>

        <div id="ordersContainer">
            <!-- Orders will be loaded here -->
        </div>
        
        <div id="emptyOrders" class="empty-orders" style="display: none;">
            <i class="fas fa-box-open empty-orders-icon"></i>
            <h4>No orders found</h4>
            <p class="text-muted">You haven't placed any orders yet</p>
            <a href="/legacy-ecommerce/products" class="btn btn-primary">
                <i class="fas fa-shopping-bag"></i> Start Shopping
            </a>
        </div>
        
        <div id="loading" class="text-center">
            <div class="spinner-border" role="status">
                <span class="sr-only">Loading...</span>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function() {
            loadOrders();
            updateCartCount();
        });

        function loadOrders() {
            $.ajax({
                url: '/legacy-ecommerce/api/orders',
                method: 'GET',
                success: function(orders) {
                    $('#loading').hide();
                    if (orders.length === 0) {
                        $('#emptyOrders').show();
                    } else {
                        displayOrders(orders);
                    }
                },
                error: function() {
                    $('#loading').hide();
                    $('#ordersContainer').html('<div class="alert alert-danger">Error loading orders. Please try again later.</div>');
                }
            });
        }

        function displayOrders(orders) {
            let html = '';
            
            // Sort orders by date (newest first)
            orders.sort((a, b) => new Date(b.orderDate) - new Date(a.orderDate));
            
            orders.forEach(function(order) {
                const statusClass = `status-${order.status.toLowerCase()}`;
                const statusIcon = getStatusIcon(order.status);
                
                html += `
                    <div class="order-card">
                        <div class="order-header">
                            <div class="row align-items-center">
                                <div class="col-md-3">
                                    <strong>Order ${order.orderNumber}</strong>
                                </div>
                                <div class="col-md-3">
                                    <span class="${statusClass}">
                                        <i class="${statusIcon}"></i> ${order.status}
                                    </span>
                                </div>
                                <div class="col-md-3">
                                    <small class="text-muted">
                                        Placed on ${new Date(order.orderDate).toLocaleDateString()}
                                    </small>
                                </div>
                                <div class="col-md-3 text-right">
                                    <span class="total-amount">$${order.totalAmount || '0.00'}</span>
                                </div>
                            </div>
                        </div>
                        <div class="order-body">
                            <div class="row">
                                <div class="col-md-8">
                                    <h6>Order Items</h6>
                                    <div id="orderItems-${order.id}">
                                        ${order.orderItems && order.orderItems.length > 0 ? 
                                            order.orderItems.map(item => `
                                                <div class="order-item">
                                                    <div class="row align-items-center">
                                                        <div class="col-md-6">
                                                            <strong>${item.product ? item.product.name : 'Product'}</strong>
                                                        </div>
                                                        <div class="col-md-2">
                                                            Qty: ${item.quantity}
                                                        </div>
                                                        <div class="col-md-2">
                                                            $${item.unitPrice || '0.00'}
                                                        </div>
                                                        <div class="col-md-2 text-right">
                                                            $${item.subtotal || '0.00'}
                                                        </div>
                                                    </div>
                                                </div>
                                            `).join('') : 
                                            '<p class="text-muted">No items found</p>'
                                        }
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <h6>Shipping Information</h6>
                                    <p class="mb-1">
                                        <strong>Address:</strong><br>
                                        ${order.shippingAddress || 'Not provided'}
                                    </p>
                                    ${order.shippedDate ? `
                                        <p class="mb-1">
                                            <strong>Shipped:</strong> ${new Date(order.shippedDate).toLocaleDateString()}
                                        </p>
                                    ` : ''}
                                    ${order.deliveredDate ? `
                                        <p class="mb-1">
                                            <strong>Delivered:</strong> ${new Date(order.deliveredDate).toLocaleDateString()}
                                        </p>
                                    ` : ''}
                                    
                                    <div class="mt-3">
                                        <button class="btn btn-outline-primary btn-sm" onclick="trackOrder('${order.orderNumber}')">
                                            <i class="fas fa-truck"></i> Track Order
                                        </button>
                                        ${order.status === 'DELIVERED' ? `
                                            <button class="btn btn-outline-secondary btn-sm ml-2" onclick="reorder(${order.id})">
                                                <i class="fas fa-redo"></i> Reorder
                                            </button>
                                        ` : ''}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            $('#ordersContainer').html(html);
        }

        function getStatusIcon(status) {
            const icons = {
                'PENDING': 'fas fa-clock',
                'CONFIRMED': 'fas fa-check-circle',
                'PROCESSING': 'fas fa-cog',
                'SHIPPED': 'fas fa-truck',
                'DELIVERED': 'fas fa-box-open',
                'CANCELLED': 'fas fa-times-circle'
            };
            return icons[status] || 'fas fa-info-circle';
        }

        function trackOrder(orderNumber) {
            alert(`Tracking information for order ${orderNumber}\n\nThis feature would typically integrate with shipping providers to show real-time tracking information.`);
        }

        function reorder(orderId) {
            alert(`Reorder functionality for order ID ${orderId}\n\nThis would add all items from this order back to your cart.`);
        }

        function updateCartCount() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            $('#cartCount').text(totalItems);
        }
    </script>
</body>
</html>
