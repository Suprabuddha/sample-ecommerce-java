# Legacy Ecommerce Application Configuration
# Contains intentional technical debt for upgrade testing

# Server Configuration
server.port=8080
server.servlet.context-path=/legacy-ecommerce

# Database Configuration - H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:ecommerce
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# TECHNICAL DEBT: Using deprecated H2 console configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# TECHNICAL DEBT: Using deprecated Hibernate properties
spring.jpa.properties.hibernate.jdbc.batch_size=20

# Logging Configuration - TECHNICAL DEBT: Using Log4j 1.x
logging.level.com.example.ecommerce=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# TECHNICAL DEBT: Deprecated logging configuration
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Jackson Configuration - TECHNICAL DEBT: Using old Jackson version
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false

# TECHNICAL DEBT: Deprecated Jackson configuration
spring.jackson.mapper.ACCEPT_CASE_INSENSITIVE_PROPERTIES=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# TECHNICAL DEBT: Insecure configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# TECHNICAL DEBT: Weak security settings
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# Application Specific Properties
app.name=Legacy Ecommerce Application
app.version=1.0.0
app.description=Sample ecommerce application with technical debt

# TECHNICAL DEBT: Hardcoded values that should be externalized
app.default.page.size=50
app.max.file.upload.size=10MB
app.session.timeout=30

# TECHNICAL DEBT: Insecure default values
app.encryption.key=defaultkey123
app.jwt.secret=mysecretkey
app.admin.email=admin@example.com