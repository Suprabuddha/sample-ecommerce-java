# Legacy Ecommerce Application Configuration
# Updated for Spring Boot 3 compatibility

# Server Configuration
server.port=8080
server.servlet.context-path=/legacy-ecommerce

# Database Configuration - H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:ecommerce
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console configuration (Spring Boot 3 compatible)
spring.h2.console.enabled=true

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate properties (updated for Spring Boot 3)
spring.jpa.properties.hibernate.jdbc.batch_size=20

# Logging Configuration - Using SLF4J with Logback (Spring Boot 3 default)
logging.level.com.example.ecommerce=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Logging patterns
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# TECHNICAL DEBT: Insecure configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# TECHNICAL DEBT: Weak security settings (updated for Spring Boot 3)
spring.security.user.name=admin
spring.security.user.password=admin123

# Application Specific Properties
app.name=Legacy Ecommerce Application
app.version=1.0.0
app.description=Sample ecommerce application with technical debt

# TECHNICAL DEBT: Hardcoded values that should be externalized
app.default.page.size=50
app.max.file.upload.size=10MB
app.session.timeout=30

# TECHNICAL DEBT: Insecure default values
app.encryption.key=defaultkey123
app.jwt.secret=mysecretkey
app.admin.email=admin@example.com